<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081d40" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self'; manifest-src 'self'; style-src 'self'"
    />
    <title>Upskill is offline</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="manifest"
      href="/site.webmanifest"
      media="(hover: none) and (pointer: coarse)"
    />
    <link rel="stylesheet" href="/offline.css" />
  </head>
  <body>
    <main class="offline-shell">
      <img
        class="offline-shell__logo"
        src="/android-chrome-192x192.png"
        alt=""
        width="96"
        height="96"
      />
      <p class="offline-shell__eyebrow">Upskill Institute</p>
      <h1>You&rsquo;re offline</h1>
      <p>
        Reconnect to continue using Upskill. Course downloads and offline
        progress are not enabled in this first application-shell release.
      </p>
      <a class="offline-shell__action" href="/">Try again</a>
    </main>
  </body>
</html>
