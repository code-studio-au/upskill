include classpath("application.conf")

node-address {
  protocol = http
  host = "127.0.0.1"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  upskill-work {
    defaultVisibilityTimeout = 900 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "upskill-work-dlq"
      maxReceiveCount = 5
    }
  }
  upskill-work-dlq {}
}
