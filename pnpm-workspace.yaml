packages:
  - deploy/cdk

# Delay newly published packages for seven days so dependency updates have a
# meaningful observation window. Exceptions are intentionally prohibited.
minimumReleaseAge: 10080
blockExoticSubdeps: true
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lightningcss: true

overrides:
  "@aws-sdk/s3-request-presigner>@smithy/core": 3.31.1
  "@aws-sdk/s3-request-presigner>@smithy/types": 4.16.1
  "fast-uri@<3.1.6": 3.1.6
  "js-yaml@<4.3.2": 4.3.2
  "nanoid@<3.3.18": 3.3.18
