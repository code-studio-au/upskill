packages:
  - deploy/cdk

# Delay newly published packages for seven days so dependency updates have a
# meaningful observation window. Exceptions are intentionally prohibited.
minimumReleaseAge: 10080
blockExoticSubdeps: true
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lightningcss: true

overrides:
  "nanoid@<3.3.18": 3.3.18
