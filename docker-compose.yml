services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: upskill
      POSTGRES_PASSWORD: upskill
      POSTGRES_USER: upskill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upskill -d upskill"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - upskill-postgres:/var/lib/postgresql

volumes:
  upskill-postgres:
