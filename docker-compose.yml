services:
  postgres:
    image: postgres:18.3-alpine
    container_name: upskill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: upskill
      POSTGRES_PASSWORD: upskill
      POSTGRES_USER: upskill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upskill -d upskill"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./.local/postgres:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: upskill-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${MINIO_API_PORT:-9020}:9000"
      - "${MINIO_CONSOLE_PORT:-9021}:9001"
    volumes:
      - ./.local/minio/data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/upskill-quarantine;
        mc mb --ignore-existing local/upskill-learning-content;
        mc mb --ignore-existing local/upskill-private-resources;
        mc mb --ignore-existing local/upskill-certificates;
        mc version enable local/upskill-learning-content;
        mc version enable local/upskill-private-resources;
        mc version enable local/upskill-certificates

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: upskill-elasticmq
    restart: unless-stopped
    ports:
      - "${ELASTICMQ_PORT:-9324}:9324"
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro

  elasticmq-ui:
    image: softwaremill/elasticmq-ui:1.7.1
    container_name: upskill-elasticmq-ui
    restart: unless-stopped
    depends_on:
      - elasticmq
    environment:
      SQS_ENDPOINT: http://elasticmq:9324
    ports:
      - "${ELASTICMQ_UI_PORT:-9325}:3000"
